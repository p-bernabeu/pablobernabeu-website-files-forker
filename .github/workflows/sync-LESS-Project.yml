name: Sync mirror/LESS-Project

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: pablobernabeu/LESS-Project
          fetch-depth: 0
          path: source-repo

      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          repository: p-bernabeu/pablobernabeu-website-files-forker
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: dest-repo

      - name: Sync content
        run: |
          cd dest-repo
          git checkout mirror/LESS-Project 2>/dev/null || git checkout --orphan mirror/LESS-Project
          git rm -rf . 2>/dev/null || true

          cd ../source-repo
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec cp -r {} ../dest-repo/ \;

          cd ../dest-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync from pablobernabeu/LESS-Project" || echo "No changes to commit"
          git push origin mirror/LESS-Project
